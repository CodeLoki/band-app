name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run tests with coverage
        run: |
          set +e
          set -o pipefail
          pnpm test:coverage 2>&1 | tee coverage-output.txt
          test_exit=${PIPESTATUS[0]}

          # Keep only the aggregate coverage row for summaries and comments.
          perl -pe 's/\e\[[0-9;]*[[:alpha:]]//g' coverage-output.txt > coverage-clean.txt
          awk -F '|' '/^All files[[:space:]]+\|/ { print; found = 1; exit } END { if (!found) exit 1 }' coverage-clean.txt > coverage-summary.txt || printf '%s\n' 'Coverage summary unavailable.' > coverage-summary.txt
          exit "$test_exit"
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo '## Code coverage'
            echo
            echo '```text'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment coverage on pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('coverage-output.txt') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- band-app-coverage -->';
            const coverage = fs.readFileSync('coverage-summary.txt', 'utf8');
            const body = `${marker}
            ## Code coverage

            \`\`\`text
            ${coverage}
            \`\`\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number
            });
            const existingComment = comments.find(
              (comment) => comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }
