<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" role="img" aria-labelledby="title desc"><title id="title">Planet X Mission Insignia</title><desc id="desc">A circular classified mission insignia for the band Planet X.</desc><defs><radialGradient id="space" cx="38%" cy="32%" r="72%"><stop offset="0" stop-color="#263a48"/><stop offset="1" stop-color="#101820"/></radialGradient><clipPath id="badgeClip"><circle cx="350" cy="350" r="318"/></clipPath></defs><!-- Mission badge --><circle cx="350" cy="350" r="330" fill="#f4f1e8"/><circle cx="350" cy="350" r="313" fill="url(#space)" stroke="#e56b3f" stroke-width="12"/><circle cx="350" cy="350" r="279" fill="none" stroke="#f4f1e8" stroke-width="2" opacity=".55"/><!-- Star field --><g fill="#f4f1e8" opacity=".8"><circle cx="146" cy="202" r="3"/><circle cx="190" cy="290" r="2"/><circle cx="520" cy="201" r="3"/><circle cx="555" cy="299" r="2"/><circle cx="154" cy="424" r="2"/><circle cx="542" cy="447" r="3"/><circle cx="245" cy="153" r="2"/><circle cx="453" cy="156" r="2"/></g><!-- Eclipse planet --><circle cx="350" cy="349" r="130" fill="#e56b3f"/><circle cx="385" cy="326" r="130" fill="#101820"/><path d="M212 397c68-40 163-48 276-13" fill="none" stroke="#f4f1e8" stroke-width="5" opacity=".5"/><path d="M225 428c63-27 135-31 227-7" fill="none" stroke="#f4f1e8" stroke-width="3" opacity=".35"/><!-- Signal crosshair --><g fill="none" stroke="#f4f1e8" stroke-linecap="square"><path d="M350 173v44M350 481v44M174 350h44M482 350h44" stroke-width="8"/><path d="M350 257v186M257 350h186" stroke="#e56b3f" stroke-width="5" opacity=".9"/></g><!-- X insignia --><path d="M300 298 400 402M400 298 300 402" fill="none" stroke="#101820" stroke-width="28" stroke-linecap="square"/><path d="M300 298 400 402M400 298 300 402" fill="none" stroke="#f4f1e8" stroke-width="20" stroke-linecap="square"/><!-- Typography --><g fill="#f4f1e8" stroke="#101820" stroke-width="3" paint-order="stroke fill" font-family="Arial Narrow, Avenir Next Condensed, sans-serif" font-weight="800" text-anchor="middle"><text x="350" y="138" font-size="60" letter-spacing="14">PLANET</text></g><!-- Encoded member initials --><text x="350" y="600" fill="#e56b3f" font-family="monospace" font-size="18" letter-spacing="8" text-anchor="middle" opacity=".9">C / A / M / P</text><!-- Small mission ticks --><g fill="#e56b3f"><rect x="75" y="342" width="42" height="16"/><rect x="583" y="342" width="42" height="16"/></g><g clip-path="url(#badgeClip)" fill="none" stroke="#e56b3f" stroke-width="4" opacity=".8"><path d="M80 520h75M545 520h75"/></g></svg>
